services:
  mongodb:
    image: mongo:8.0
    container_name: smartcity_mongodb
    restart: unless-stopped

    ports:
      - "${MONGO_PORT}:27017"

    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE}

    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data:
